name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Derle
        run: gradle :app:assembleRelease --no-daemon
      - name: APK adını düzelt
        run: cp app/build/outputs/apk/release/app-release.apk BorcBakiye.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BorcBakiye-apk
          path: BorcBakiye.apk
      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son -y --cleanup-tag || true
          gh release create son BorcBakiye.apk --title "Borç ve Bakiye (son sürüm)" --notes "Telefona indirip kur. Derleme: ${{ github.sha }}" --target ${{ github.sha }}
