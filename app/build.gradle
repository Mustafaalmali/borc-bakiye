plugins {
    id "com.android.application"
}

android {
    namespace "com.atespin.borc"
    compileSdk 34

    defaultConfig {
        applicationId "com.atespin.borc"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Kendi imza anahtarın olmadığı için debug anahtarıyla imzalanır; telefona kurulabilir.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
